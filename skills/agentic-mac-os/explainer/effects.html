<!doctype html>
<!--
  Effects layer of the HUD: what celebrates a moment and then is gone (the banner across a cleared
  page, the achievement that opens under the bar, sparks, the ring around a pressed button).
  `dw` copies this file to <state>/explain/effects.html; the HUD loads it into a see-through,
  click-through window as large as the screen (hud/Effects.swift) and calls `fx.<name>(…)`.
  Every position is in points from the top-left corner of that window. When nothing is left to
  draw, the page says so and the HUD takes the window away.
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- Local file only: the layer never loads anything -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.5 -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased; cursor: default; -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .ring { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); box-sizing: border-box; }

  /* The banner across a cleared page (or, compact, across a note) */
  .banner { position: absolute; overflow: hidden; display: grid; place-items: center; }
  .banner .dim { position: absolute; inset: 0; background: rgba(8, 10, 9, .55); opacity: 0; }
  .banner .strip {
    position: relative; width: 100%; box-sizing: border-box; padding: 22px 30px; text-align: center;
    background: linear-gradient(90deg, rgba(14, 40, 30, .97), rgba(20, 60, 44, .97) 50%, rgba(14, 40, 30, .97));
    border-top: 1px solid #5ccc9e; border-bottom: 1px solid #5ccc9e;
  }
  .banner .k { font-size: 12px; letter-spacing: .34em; color: #a6e6c9; font-weight: 700; }
  .banner .t { font-size: 24px; font-weight: 800; margin: 4px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner .s { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 22px; color: #cfe9dd; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .banner .s:empty { display: none; }
  .banner.compact .strip { padding: 10px 16px; }
  .banner.compact .k { font-size: 10.5px; }
  .banner.compact .t { font-size: 16px; margin: 1px 0 2px; }
  .banner.compact .s { font-size: 12px; }

  /* The achievement: a circle lands, opens into a pill, closes again */
  .toast {
    position: absolute; height: 52px; width: 52px; border-radius: 26px; transform: translateX(-50%); box-sizing: border-box;
    background: rgba(24, 26, 30, .97); border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 12px 34px rgba(0, 0, 0, .6);
    display: flex; align-items: center; overflow: hidden;
  }
  .toast .ico { width: 50px; height: 50px; flex: none; display: grid; place-items: center; font-size: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #454b57, #1d2026); }
  .toast .body { white-space: nowrap; padding: 0 24px 0 10px; }
  .toast .k { font-size: 11px; color: #9aa0aa; letter-spacing: .1em; line-height: 1.3; }
  .toast .t { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .toast .g { color: #ffd34d; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .toast .d { color: #c9ced6; font-weight: 500; margin-left: 8px; }
  @media (prefers-contrast: more) {
    .toast { border-color: rgba(255, 255, 255, .7); }
    .toast .k, .toast .d { color: #fff; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  'use strict';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches || new URLSearchParams(location.search).has('reduced');
  // The HUD listens on this channel; opened in a plain browser the layer still draws
  const post = message => { try { window.webkit.messageHandlers.dw.postMessage(message); } catch (_) { /* no HUD */ } };
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  // ---- how much is still on screen: the HUD removes the window when this reaches nothing ----
  let running = 0;
  let idleTimer = 0;
  function begin() { running += 1; clearTimeout(idleTimer); }
  function end() {
    running = Math.max(0, running - 1);
    settle();
  }
  function settle() {
    clearTimeout(idleTimer);
    if (running === 0 && particles.length === 0) idleTimer = setTimeout(() => { if (running === 0 && particles.length === 0) post({ type: 'fx-idle', sent: window.fx.sent || 0 }); }, 180);
  }

  // ---- sparks ----
  const canvas = document.getElementById('canvas');
  const pen = canvas.getContext('2d');
  let particles = [];
  let frame = 0;
  let last = 0;
  function fit() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = innerWidth * ratio;
    canvas.height = innerHeight * ratio;
    pen.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  fit();
  addEventListener('resize', fit);

  /** Throw sparks from a point. Nothing moves while "Reduce motion" is on. */
  function burst({ x, y, count = 12, colors = ['#5ccc9e'], speed = 200, gravity = 520, life = 650, size = 4, shape = 'dot', spread = Math.PI * 2, angle = -Math.PI / 2 } = {}) {
    if (reduced) { settle(); return; }
    const now = performance.now();
    for (let i = 0; i < count; i++) {
      const a = angle + (Math.random() - 0.5) * spread;
      const v = speed * (0.45 + Math.random() * 0.75);
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, gravity, born: now, life: life * (0.7 + Math.random() * 0.6),
        size: size * (0.7 + Math.random() * 0.7), color: colors[i % colors.length], shape, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 10,
      });
    }
    clearTimeout(idleTimer);
    if (!frame) { last = now; frame = requestAnimationFrame(tick); }
  }
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pen.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => now - p.born < p.life);
    for (const p of particles) {
      p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      const age = (now - p.born) / p.life;
      pen.globalAlpha = age < 0.7 ? 1 : (1 - age) / 0.3;
      pen.fillStyle = p.color;
      pen.save(); pen.translate(p.x, p.y); pen.rotate(p.rot);
      if (p.shape === 'square') { pen.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); } else { pen.beginPath(); pen.arc(0, 0, p.size / 2, 0, 6.283); pen.fill(); }
      pen.restore();
    }
    pen.globalAlpha = 1;
    if (particles.length) { frame = requestAnimationFrame(tick); } else { frame = 0; settle(); }
  }

  /** A ring that grows out of a point and fades: the echo of a press. */
  function ring({ x, y, color = '#5ccc9e', from = 14, to = 46, ms = 420, width = 2 } = {}) {
    if (reduced) { settle(); return; }
    begin();
    const el = document.createElement('div');
    el.className = 'ring';
    el.style.cssText = `left:${x}px;top:${y}px;width:${from}px;height:${from}px;border:${width}px solid ${color}`;
    document.body.appendChild(el);
    el.animate([{ opacity: 0.9, width: `${from}px`, height: `${from}px` }, { opacity: 0, width: `${to}px`, height: `${to}px` }], { duration: ms, easing: 'ease-out' })
      .onfinish = () => { el.remove(); end(); };
  }

  function node(className, text) {
    const el = document.createElement('div');
    el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  /**
   * The banner of a cleared page: a strip that slides across the rectangle of the page it is about.
   * `compact` is the smaller one, for a note.
   */
  async function banner({ x, y, w, h, radius = 14, kicker = 'QUEST COMPLETE', title = '', stats = [], compact = false } = {}) {
    begin();
    const box = node(`banner${compact ? ' compact' : ''}`);
    box.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${radius}px`;
    const dim = node('dim');
    const strip = node('strip');
    strip.append(node('k', kicker), node('t', title));
    const line = node('s');
    for (const stat of stats) { const cell = document.createElement('span'); cell.textContent = stat; line.appendChild(cell); }
    strip.appendChild(line);
    box.append(dim, strip);
    document.body.appendChild(box);
    dim.animate([{ opacity: 0 }, { opacity: compact ? 0.6 : 1 }], { duration: 260, fill: 'forwards' });
    strip.animate(reduced ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(-102%)' }, { transform: 'translateX(0)' }],
      { duration: reduced ? 200 : 420, easing: 'cubic-bezier(.2, .9, .3, 1)', fill: 'both' });
    await wait(430);
    const r = strip.getBoundingClientRect();
    const colors = ['#5ccc9e', '#ffffff', '#ffd98a'];
    const count = compact ? 8 : 16;
    burst({ x: r.left + 30, y: r.top + r.height / 2, count, colors, speed: compact ? 180 : 260, angle: -0.9, spread: 1.4, life: 900 });
    burst({ x: r.right - 30, y: r.top + r.height / 2, count, colors, speed: compact ? 180 : 260, angle: -2.25, spread: 1.4, life: 900 });
    await wait(compact ? 1000 : 1500);
    strip.animate(reduced ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'translateX(0)' }, { transform: 'translateX(102%)' }], { duration: 300, easing: 'ease-in', fill: 'forwards' });
    dim.animate([{ opacity: compact ? 0.6 : 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    await wait(320);
    box.remove();
    end();
  }

  // Achievements wait for each other: two at once come one after the other
  let toasts = Promise.resolve();
  /** An achievement: `cx` is the centre it opens around, `top` its upper edge. */
  function toast(options = {}) {
    begin();
    toasts = toasts.then(() => showToast(options)).then(end, end);
    return toasts;
  }
  async function showToast({ cx, top, kicker = '実績を解除しました', title = '', desc = '', points = '' } = {}) {
    const el = node('toast');
    el.style.left = `${cx}px`;
    el.style.top = `${top}px`;
    const body = node('body');
    const line = node('t');
    if (points !== '') { const g = document.createElement('span'); g.className = 'g'; g.textContent = `${points} G`; line.appendChild(g); }
    line.appendChild(document.createTextNode(title));
    if (desc) { const d = document.createElement('span'); d.className = 'd'; d.textContent = desc; line.appendChild(d); }
    body.append(node('k', kicker), line);
    el.append(node('ico', '🏆'), body);
    document.body.appendChild(el);
    const open = 52 + body.scrollWidth;
    if (reduced) {
      el.style.width = `${open}px`;
      await el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'both' }).finished;
      await wait(2600);
      await el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'both' }).finished;
    } else {
      await el.animate([{ opacity: 0, transform: 'translateX(-50%) translateY(-34px) scale(.6)' }, { opacity: 1, transform: 'translateX(-50%) translateY(4px) scale(1.08)', offset: 0.7 }, { opacity: 1, transform: 'translateX(-50%) translateY(0) scale(1)' }],
        { duration: 240, easing: 'ease-out', fill: 'both' }).finished;
      ring({ x: cx, y: top + 26, color: '#ffd34d', from: 50, to: 96, ms: 520 });
      await el.animate([{ width: '52px' }, { width: `${open}px` }], { duration: 340, easing: 'cubic-bezier(.2, .9, .3, 1)', fill: 'forwards' }).finished;
      await wait(2300);
      await el.animate([{ width: `${open}px` }, { width: '52px' }], { duration: 240, easing: 'ease-in', fill: 'forwards' }).finished;
      await el.animate([{ opacity: 1, transform: 'translateX(-50%) translateY(0)' }, { opacity: 0, transform: 'translateX(-50%) translateY(-20px)' }], { duration: 180, fill: 'forwards' }).finished;
    }
    el.remove();
  }

  // `sent` is how many effects the HUD has asked for: it comes back with "nothing left", so the HUD
  // keeps the window when another effect is already on its way
  window.fx = { banner, toast, burst, ring, sent: 0 };
  post({ type: 'fx-ready' });
})();
</script>
</body>
</html>
