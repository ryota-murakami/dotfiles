   comes first (text, code, tables, diagrams); these rules add the panel around the pages and win over
   page.html's \`body\` rules by being more specific (\`body.handout\`). */
html,
body.handout {
  height: 100%;
}
body.handout {
  /* The panel's own text: the system face on every reader's machine (macOS, Windows, Linux), then
     Japanese faces of each, so the header and the pager read the same in any browser */
  --ui-font:
    -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', 'Yu Gothic UI', Meiryo, 'Noto Sans JP',
    'Noto Sans CJK JP', sans-serif;
  --mono-font: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
  margin: 0;
  padding: 0;
  background: #050506;
  display: flex;
  justify-content: center;
}
.panel {
  position: relative;
  width: min(900px, calc(100vw - 32px));
  height: calc(100vh - 32px);
  /* The visible viewport where the browser knows it: a phone's toolbar never covers the pager */
  height: calc(100dvh - 32px);
  margin: 16px 0;
  background: #121212;
  border: 1px solid rgba(92, 204, 158, 0.45);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
}
/* The edges a reader drags to widen the panel: 6px, on both sides, the width changing symmetrically */
.edge {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: ew-resize;
  z-index: 6;
  touch-action: none;
}
.edge.left {
  left: 0;
}
.edge.right {
  right: 0;
}
.header {
  flex: none;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 12px;
}
.heading {
  font: 600 13px/1 var(--ui-font);
  color: #fff;
  white-space: nowrap;
}
#pageno {
  font: 12px/1 var(--mono-font);
  color: rgba(235, 235, 245, 0.6);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.title {
  flex: 1;
  min-width: 0;
  font: 13px/1 var(--ui-font);
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-left: 4px;
}
/* 28px: a control smaller than 20 points is hard to hit */
.btn {
  flex: none;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: rgba(235, 235, 245, 0.85);
  font: 16px/1 var(--ui-font);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
}
.btn:hover {
  background: rgba(255, 255, 255, 0.08);
}
.btn:disabled {
  opacity: 0.3;
  cursor: default;
  background: transparent;
}
.btn[aria-expanded='true'] {
  background: rgba(92, 204, 158, 0.22);
  color: #fff;
}
.gap {
  width: 8px;
  flex: none;
}
.zoom {
  width: 42px;
  text-align: center;
  font: 12px/1 var(--mono-font);
  color: rgba(235, 235, 245, 0.6);
  font-variant-numeric: tabular-nums;
}
.progress {
  flex: none;
  height: 2px;
  margin: 0 1px;
  background: rgba(255, 255, 255, 0.08);
}
/* Scaled from the left, never resized: moving the bar lays nothing out again */
.progress > i {
  display: block;
  height: 100%;
  width: 100%;
  transform: scaleX(0);
  transform-origin: left;
  background: var(--accent);
  transition: transform 0.2s;
}
.scroller {
  flex: 1;
  overflow-y: auto;
  margin: 0 6px 6px;
}
/* The reading area takes the focus when a page opens from a control it hides; a ring only for the keyboard */
.scroller:focus:not(:focus-visible) {
  outline: none;
}
/* Read to screen readers, never shown: the page number and title after each page change */
.announcer {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.page {
  padding: 16px 22px 48px;
}
.page .section {
  color: var(--accent);
  font-size: 0.82em;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.pager {
  display: flex;
  gap: 10px;
  margin-top: 2.2em;
  padding-top: 1em;
  border-top: 1px solid var(--line);
}
.pager button {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  padding: 8px 12px;
  color: #e9e9e9;
  cursor: pointer;
  font: 13px/1.5 var(--ui-font);
}
.pager button:hover {
  border-color: var(--accent);
}
.pager button.next {
  text-align: right;
  margin-left: auto;
}
.pager small {
  display: block;
  color: rgba(235, 235, 245, 0.6);
  font-size: 12px;
}
.pager span {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc {
  position: absolute;
  top: 40px;
  right: 8px;
  width: min(460px, calc(100% - 16px));
  max-height: calc(100% - 56px);
  overflow-y: auto;
  background: #1c1c1e;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  padding: 6px;
  z-index: 5;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
.toc button {
  display: flex;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  color: #e9e9e9;
  cursor: pointer;
  font: 13px/1.45 var(--ui-font);
}
.toc button:hover {
  background: rgba(255, 255, 255, 0.08);
}
.toc button[aria-current='page'] {
  background: rgba(92, 204, 158, 0.2);
}
.toc b {
  flex: none;
  width: 2.2em;
  color: rgba(235, 235, 245, 0.6);
  font: 12px/1.6 var(--mono-font);
}
.toc small {
  display: block;
  color: var(--accent);
  font-size: 12px;
}
/* The keyboard's place is plain to see on the dark panel: the accent ring, on every control and on a
   diagram (which Enter enlarges) */
.btn:focus-visible,
.pager button:focus-visible,
.toc button:focus-visible,
.diagram-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
/* A diagram's own button, on a line of its own above the drawing, at the right: the keyboard's and the
   screen reader's way to show the diagram at natural size (a click on the diagram does the same).
   Laid over the drawing, a finger-sized button would cover a label on a phone */
.diagram-toggle {
  display: block;
  margin: 0 0 8px auto;
  padding: 4px 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  background: rgba(18, 18, 18, 0.85);
  color: #e9e9e9;
  font: 12px/1 var(--ui-font);
  cursor: pointer;
}
.diagram-toggle[aria-pressed='true'] {
  border-color: var(--accent);
}
/* A finger needs a larger target than a pointer: 40px header controls in a header tall enough to hold
   them, 44px rows in the table of contents and the pager, a larger copy button */
@media (pointer: coarse) {
  .header {
    height: 44px;
  }
  .btn {
    width: 40px;
    height: 40px;
  }
  .toc {
    top: 48px;
  }
  .toc button,
  .pager button {
    min-height: 44px;
  }
  body.handout .copy,
  .diagram-toggle {
    min-height: 36px;
    padding: 8px 12px;
  }
}
/* A touch screen keeps a hover look after the tap that caused it: there is no hover there */
@media (hover: none) {
  .btn:hover,
  .toc button:hover {
    background: transparent;
  }
  .pager button:hover {
    border-color: rgba(255, 255, 255, 0.12);
  }
}
/* A narrow window keeps the room for the title: the zoom controls go (the browser's own zoom
   remains). A phone gives the panel the whole screen: no margin, border or rounded corners, no edges
   to drag, and a narrower page padding, so text and code keep their width */
@media (max-width: 480px) {
  .header .zoom-control {
    display: none;
  }
  /* !important: a width remembered from a drag on a wider window is an inline style */
  .panel {
    width: 100vw !important;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border: 0;
    border-radius: 0;
  }
  .edge {
    display: none;
  }
  .page {
    padding-left: 14px;
    padding-right: 14px;
  }
}
/* A reader who asked the system for more contrast: the quiet grey texts go white, the borders show */
@media (prefers-contrast: more) {
  #pageno,
  .zoom,
  .pager small,
  .toc b {
    color: #fff;
  }
  .panel {
    border-color: var(--accent);
  }
  .pager button,
  .toc {
    border-color: rgba(255, 255, 255, 0.5);
  }
}
@media (prefers-reduced-motion: reduce) {
  .progress > i {
    transition: none;
  }
}
/* Print: every page, one after another, without the panel's controls; the dragged width plays no part */
@media print {
  body.handout {
    background: #121212;
    display: block;
    height: auto;
  }
  .panel {
    height: auto;
    width: auto !important;
    margin: 0;
    border: 0;
    box-shadow: none;
    overflow: visible;
  }
  .header,
  .progress,
  .pager,
  .toc,
  .edge,
  .copy,
  .diagram-toggle {
    display: none !important;
  }
  .scroller {
    overflow: visible;
    margin: 0;
  }
  .page[hidden] {
    display: block !important;
  }
  .page {
    break-after: page;
    zoom: 1 !important;
  }
}
