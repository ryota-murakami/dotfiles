   comes first (text, code, tables, diagrams); these rules add the panel around the pages and win over
   page.html's \`body\` rules by being more specific (\`body.handout\`). */
html,
body.handout {
  height: 100%;
}
body.handout {
  margin: 0;
  padding: 0;
  background: #050506;
  display: flex;
  justify-content: center;
}
.panel {
  position: relative;
  width: min(900px, calc(100vw - 32px));
  height: calc(100vh - 32px);
  margin: 16px 0;
  background: #121212;
  border: 1px solid rgba(92, 204, 158, 0.45);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
}
/* The edges a reader drags to widen the panel: 6px, on both sides, the width changing symmetrically */
.edge {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: ew-resize;
  z-index: 6;
  touch-action: none;
}
.edge.left {
  left: 0;
}
.edge.right {
  right: 0;
}
.header {
  flex: none;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 12px;
}
.heading {
  font:
    600 13px/1 -apple-system,
    'Hiragino Sans',
    sans-serif;
  color: #fff;
  white-space: nowrap;
}
#pageno {
  font:
    12px/1 ui-monospace,
    'SF Mono',
    Menlo,
    monospace;
  color: rgba(235, 235, 245, 0.6);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.title {
  flex: 1;
  min-width: 0;
  font:
    13px/1 -apple-system,
    'Hiragino Sans',
    sans-serif;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-left: 4px;
}
/* 28px: a control smaller than 20 points is hard to hit */
.btn {
  flex: none;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: rgba(235, 235, 245, 0.85);
  font:
    16px/1 -apple-system,
    sans-serif;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
}
.btn:hover {
  background: rgba(255, 255, 255, 0.08);
}
.btn:disabled {
  opacity: 0.3;
  cursor: default;
  background: transparent;
}
.btn[aria-expanded='true'] {
  background: rgba(92, 204, 158, 0.22);
  color: #fff;
}
.gap {
  width: 8px;
  flex: none;
}
.zoom {
  width: 42px;
  text-align: center;
  font:
    12px/1 ui-monospace,
    'SF Mono',
    Menlo,
    monospace;
  color: rgba(235, 235, 245, 0.6);
  font-variant-numeric: tabular-nums;
}
.progress {
  flex: none;
  height: 2px;
  margin: 0 1px;
  background: rgba(255, 255, 255, 0.08);
}
.progress > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.2s;
}
.scroller {
  flex: 1;
  overflow-y: auto;
  margin: 0 6px 6px;
}
.page {
  padding: 16px 22px 48px;
}
.page .section {
  color: var(--accent);
  font-size: 0.82em;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.pager {
  display: flex;
  gap: 10px;
  margin-top: 2.2em;
  padding-top: 1em;
  border-top: 1px solid var(--line);
}
.pager button {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  padding: 8px 12px;
  color: #e9e9e9;
  cursor: pointer;
  font:
    13px/1.5 -apple-system,
    'Hiragino Sans',
    sans-serif;
}
.pager button:hover {
  border-color: var(--accent);
}
.pager button.next {
  text-align: right;
  margin-left: auto;
}
.pager small {
  display: block;
  color: rgba(235, 235, 245, 0.6);
  font-size: 11.5px;
}
.pager span {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc {
  position: absolute;
  top: 40px;
  right: 8px;
  width: min(460px, calc(100% - 16px));
  max-height: calc(100% - 56px);
  overflow-y: auto;
  background: #1c1c1e;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  padding: 6px;
  z-index: 5;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
.toc button {
  display: flex;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  color: #e9e9e9;
  cursor: pointer;
  font:
    13px/1.45 -apple-system,
    'Hiragino Sans',
    sans-serif;
}
.toc button:hover {
  background: rgba(255, 255, 255, 0.08);
}
.toc button[aria-current='page'] {
  background: rgba(92, 204, 158, 0.2);
}
.toc b {
  flex: none;
  width: 2.2em;
  color: rgba(235, 235, 245, 0.6);
  font:
    12px/1.6 ui-monospace,
    'SF Mono',
    Menlo,
    monospace;
}
.toc small {
  display: block;
  color: var(--accent);
  font-size: 11px;
}
@media (prefers-reduced-motion: reduce) {
  .progress > i {
    transition: none;
  }
}
/* Print: every page, one after another, without the panel's controls; the dragged width plays no part */
@media print {
  body.handout {
    background: #121212;
    display: block;
    height: auto;
  }
  .panel {
    height: auto;
    width: auto !important;
    margin: 0;
    border: 0;
    box-shadow: none;
    overflow: visible;
  }
  .header,
  .progress,
  .pager,
  .toc,
  .edge,
  .copy {
    display: none !important;
  }
  .scroller {
    overflow: visible;
    margin: 0;
  }
  .page[hidden] {
    display: block !important;
  }
  .page {
    break-after: page;
    zoom: 1 !important;
