name: desktop-walkthrough

on:
  push:
    branches: [master]
    paths:
      - skills/desktop-walkthrough/**
      - .github/workflows/desktop-walkthrough.yml
      - .github/actions/prepare-desktop-walkthrough/**
  pull_request:
    branches: [master]
    paths:
      - skills/desktop-walkthrough/**
      - .github/workflows/desktop-walkthrough.yml
      - .github/actions/prepare-desktop-walkthrough/**

permissions:
  contents: read

concurrency:
  group: desktop-walkthrough-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/desktop-walkthrough

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/prepare-desktop-walkthrough

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Types, tests and build
        run: pnpm exec turbo run typecheck test build

      # The Mirror's page and the Handout's builder are committed, so the skill runs on a Mac without
      # Node: they must be the build of the sources beside them
      - name: The committed builds are the build of their sources
        run: git diff --exit-code -- packages/mirror/dist packages/handout/dist && test -z "$(git status --porcelain -- packages/*/dist)"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -S warning scripts/dw scripts/check scripts/typecheck-hooks scripts/hud-golden scripts/handout-check scripts/dw-check

  hud:
    name: HUD (Swift) and bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The HUD type-checks
        run: swiftc -typecheck hud/*.swift

      - name: The Handout renderer type-checks
        run: swiftc -typecheck handout/*.swift

      # macOS ships bash 3.2: the scripts must parse there
      - name: The scripts parse under /bin/bash
        run: for script in dw dw-check check typecheck-hooks hud-golden handout-check; do /bin/bash -n "scripts/$script" || exit 1; done
